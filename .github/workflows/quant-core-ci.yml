name: quant-core-ci

on:
  push:
    branches:
      - audit/quant-core-v1
      - audit/final-dev-v1r1
      - audit/final-signal-v1r1
      - audit/risk-engine-v1
      - audit/execution-engine-v1
      - audit/economic-evaluation-v1
      - audit/mt5-metadata-binding-v1
      - audit/economic-lockbox-runner-v1r1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
