name: quant-core-ci

on:
  push:
    branches:
      - audit/quant-core-v1
      - audit/final-dev-v1r1
      - audit/final-signal-v1r1
      - audit/risk-engine-v1
      - audit/execution-engine-v1
      - audit/economic-evaluation-v1
      - audit/mt5-metadata-binding-v1
      - audit/economic-lockbox-runner-v1r1
      - audit/execution-v1r2-lockbox-hardening
      - audit/signal-bridge-v1
      - audit/paper-monitor-adapter-v1
      - audit/paper-journal-demo-v1
      - audit/dev-signal-replay-v1
      - audit/dev-retrospective-observability-v1
      - audit/mt5-readonly-signal-receiver-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.10.0'

      - name: Install TypeScript
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Report frozen component source identities
        shell: bash
        run: |
          for f in \
            quant-core/execution/execution-engine-v1r2.ts \
            quant-core/economic/economic-lockbox-evaluator-v1r2.ts \
            quant-core/lockbox/one-shot-registry-v1r2.ts \
            quant-core/cli/run-economic-preflight-v1r2.ts \
            quant-core/cli/run-economic-lockbox-v1r2.ts \
            quant-core/cli/run-economic-lockbox-v1r2-production.ts \
            quant-core/research/economic-evaluation-v1r2-contracts.ts \
            quant-core/research/economic_evaluation_v1r2.spec.json \
            quant-core/research/infinox_stp_commission_evidence_v1.json \
            quant-core/bridge/signal-bridge-v1.ts \
            quant-core/research/signal_bridge_v1.spec.json \
            quant-core/research/signal_bridge_v1.implementation.json \
            adapters/paper/paper-monitor-adapter-v1.ts \
            adapters/paper/paper_monitor_adapter_v1.spec.json \
            adapters/paper/paper_monitor_adapter_v1.implementation.json \
            adapters/paper/file-paper-journal-v1.ts \
            adapters/paper/paper-journal-demo-v1.ts \
            quant-core/cli/run-paper-journal-demo-v1.ts \
            adapters/paper/paper_journal_demo_v1.spec.json \
            adapters/paper/paper_journal_demo_v1.implementation.json \
            quant-core/replay/dev-signal-replay-v1.ts \
            quant-core/cli/run-dev-signal-replay-v1.ts \
            quant-core/research/dev_signal_replay_v1.spec.json \
            quant-core/research/dev_signal_replay_v1.implementation.json \
            quant-core/replay/dev-retrospective-observability-v1.ts \
            quant-core/cli/run-dev-retrospective-observability-v1.ts \
            quant-core/research/dev_retrospective_observability_v1.spec.json \
            quant-core/research/dev_retrospective_observability_v1.implementation.json \
            adapters/mt5/readonly-signal-transport-v1.ts \
            quant-core/cli/run-mt5-readonly-transport-v1.ts \
            adapters/mt5/MT5_ReadOnly_Signal_Receiver_V1.mq5 \
            adapters/mt5/mt5_readonly_signal_receiver_v1.spec.json \
            adapters/mt5/mt5_readonly_signal_receiver_v1.implementation.json; do
            printf '%s bytes=' "$f"
            wc -c < "$f" | tr -d ' \n'
            printf ' sha256='
            sha256sum "$f" | awk '{print $1}'
          done
